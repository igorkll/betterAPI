; Example configuration for DSBoxModRuntime.dll.
;
; Layout expected next to the GAME's main executable (the folder the
; user points Steam's launch options at). Everything DSBox ships is
; encapsulated inside a single "dsbox" subfolder so the game's own
; directory only ever gains one extra file (the loader):
;
;   <package_root>\DSBoxModLoader.exe
;   <package_root>\bin\framework\mod\DSBoxModRuntime.dll
;   <package_root>\bin\dsbox\config\modules.ini
;   <package_root>\bin\dsbox\modules\<your module>.dll
;   <game_folder>\dsbox\DSBoxCore.dll, DSBoxConfig.dll, DSBoxIni.dll (+ deps)
;   <game_folder>\dsbox\config\modules.ini   <-- this file, renamed
;   <game_folder>\dsbox\modules\your_mod.dll
;
; Every "<alias>.path" key under [modules] describes one mod DLL to
; load. <alias> is just a grouping label -- it does not have to match
; the module's own name(). Relative paths are resolved against the
; `dsbox\modules\` folder next to this ini.

[modules]
my_mod.path    = modules/my_mod.dll
my_mod.enabled = true

; Disabled entries are parsed but skipped, not treated as errors.
; another_mod.path    = modules/another_mod.dll
; another_mod.enabled = false
