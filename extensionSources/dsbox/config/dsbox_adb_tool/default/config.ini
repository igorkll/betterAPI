; Shipped defaults for dsbox_adb_tool. Treated as read-only by
; PersistentConfigStore -- a user override goes in config/config.ini
; instead (created automatically the first time a value is changed with
; the "config set" command, if one gets added later; for now this file
; is simply hand-edited).
;
; Moved here (repo-level config/dsbox_adb_tool/default/config.ini) as
; part of the top-level config/ consolidation -- was previously
; dsbox_adb_tool/config/default/config.ini, copied next to the built
; exe by dsbox_adb_tool/CMakeLists.txt's POST_BUILD step. At build time
; it still lands next to the exe (at <exe dir>/../config/dsbox_adb_tool/
; default/config.ini, i.e. bin/config/dsbox_adb_tool/default/config.ini
; alongside bin/executables/), consistent with every tool's config now
; living under one bin/config/ tree instead of scattered per-exe
; folders. See docs/BUILD_LAYOUT.md.
;
; Resolved relative to the executable's own directory by default; see
; --pathmode in the CLI if you run it from somewhere else.

[android.adb]
; Name or full path of the adb executable. A bare name is resolved via
; PATH -- make sure `adb` (from Android platform-tools) is on it, or
; point this at the full path, e.g. C:\Android\platform-tools\adb.exe
adb_path                 = adb

; How often the automatic device watch polls `adb devices -l`, in
; milliseconds. Set to 0 to disable background polling; the Devices
; panel still has a manual Refresh button.
device_watch_interval_ms = 1000

; Whether the device watch starts automatically when the app starts.
auto_start_device_watch  = true

; Worker count for the command executor behind every "shell"/"install"/
; "uninstall"/"push"/"pull"/"reboot"/"packages" command (AdbModule::device()).
; Limits the number of ADB operations that can run at the same time.
; 0 = std::thread::hardware_concurrency().
command_threads          = 0

[scheduler]
; Size of the shared timer/worker pool backing the device watch and any
; future timer-based features. 0 = one thread per core.
threads = 0
